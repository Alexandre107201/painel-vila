<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist Operacional Vila | Teste</title><style>
:root{font-family:system-ui,-apple-system,Arial;color:#17324d;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#17324d;color:white;padding:20px 16px}main{max-width:720px;margin:auto;padding:14px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #102c4210}h1{font-size:23px;margin:4px 0}h2{font-size:18px;margin:0 0 8px}p,small{color:#617286}header p{color:#c9d6df}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:600}input,select,textarea{width:100%;padding:11px;margin-top:5px;border:1px solid #cbd5dc;border-radius:9px;font:inherit;background:white}textarea{min-height:62px}.item{padding:14px 0;border-top:1px solid #e3e8ed}.item strong{display:block;margin-bottom:4px}.choices{display:flex;gap:6px;margin:10px 0}.choices button{flex:1;border:1px solid #cbd5dc;border-radius:9px;background:#f7f9fa;padding:11px 5px;font-weight:650;color:#17324d}.choices button.active{background:#d9ebdf;border-color:#278354;color:#135e37}.choices button.pending.active{background:#fff1d9;border-color:#e1a43e;color:#8c5500}.choices button.na.active{background:#e9edf2;border-color:#8192a0;color:#41505e}button.action{background:#17324d;color:white;border:0;border-radius:10px;padding:13px 16px;font-weight:700;width:100%;margin-top:12px}.bar{height:11px;background:#e9eef1;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#278354;transition:width .2s}.notice{background:#fff7e8;padding:12px;border-radius:9px;font-size:13px;color:#715327}@media(max-width:440px){.grid{grid-template-columns:1fr}.choices button{font-size:12px}}@media print{button.action,.choices{display:none}header{color:#17324d;background:white}}</style></head><body><header><div style="max-width:720px;margin:auto"><small style="color:#c9d6df">VILA FIT · VILA GOURMET</small><h1>Checklist operacional</h1><p>Teste para celular · sem quantidades de produção</p></div></header><main><div class="card"><div class="grid"><label>Operação<select id="unit"><option>Vila Fit</option><option>Vila Gourmet</option></select></label><label>Data<input id="day" type="date"></label><label>Responsável<input id="owner" placeholder="Nome do colaborador"></label><label>Turno<select id="shift"><option>Abertura · 6h</option><option>Operação</option><option>Fechamento</option></select></label></div></div><div class="card"><h2>Andamento da rotina</h2><p id="progress">0 de 0 itens respondidos</p><div class="bar"><div class="fill" id="fill"></div></div></div><div id="sections"></div><div class="card"><div class="notice">Versão de teste: registros ficam somente neste navegador, não são enviados ao dashboard oficial. Anexos de fotos ainda não são armazenados.</div><button class="action" id="export">Exportar checklist (CSV)</button><button class="action" id="reset" style="background:#60758a">Limpar marcações desta rotina</button></div></main><script>
const groups=[
['Abertura · 6h','Verificações iniciais da equipe de cozinha.',[
['Higienização da equipe','Uniformes, mãos e boas práticas'],['Limpeza das bancadas e utensílios','Superfícies e equipamentos em condições de uso'],['Temperaturas dos equipamentos','Refrigeração e aquecimento verificados'],['Validade e identificação','Produtos e ingredientes conferidos'],['Planejamento da abertura','Produtos da manhã organizados conforme necessidade']]],
['Preparação dos produtos','Qualidade, segurança e apresentação, sem quantidades.',[
['Saladas de frutas · P e G','Frescor, montagem, identificação e conservação'],['Bolos e confeitaria','Padrão visual, validade e exposição'],['Paninis por sabor','Ingredientes, montagem e identificação'],['Sanduíches e wraps','Montagem, embalagem e conservação'],['Sucos e garrafinhas','Identificação, temperatura e apresentação'],['Salgados e pizzas','Preparo, conservação e apresentação']]],
['Reposição e operação','Conferir durante o dia conforme demanda.',[
['Vitrine e exposição','Produtos organizados e identificados'],['Reposição conforme vendas','Reposição necessária realizada sem excesso'],['Controle de temperatura','Temperaturas e conservação conferidas'],['Segurança alimentar','Separação e prevenção de contaminação cruzada'],['Ocorrências','Faltas, atrasos ou problemas registrados']]],
['Fechamento','Conferências e registros ao encerrar.',[
['Sobras e desperdícios','Perdas registradas para análise'],['Produtos armazenados','Identificação, validade e conservação'],['Limpeza final','Utensílios, equipamentos e bancadas'],['Pendências comunicadas','Problemas repassados à liderança'],['Geladeiras e refrigeradores ligados','Conferir alimentação elétrica, funcionamento e temperatura adequada'],['Fornos desligados','Confirmar desligamento seguro dos fornos após o uso'],['Fritadeiras desligadas','Confirmar desligamento seguro das fritadeiras após o uso'],['Luzes da operação desligadas','Conferir iluminação das áreas operacionais ao encerrar'],['Luzes do escritório desligadas','Conferir iluminação do escritório ao encerrar']]],['Manutenção preventiva · semanal','Uma vez por semana, com equipamento desligado e conforme orientação do fabricante.',[['Limpeza dos condensadores dos equipamentos','Verificar e executar limpeza dos condensadores acessíveis, por colaborador treinado, com equipamento desenergizado; quando necessário, acionar manutenção técnica']]]];
const $=id=>document.getElementById(id);$('day').value=new Date().toLocaleDateString('en-CA');
const key=()=>['checklist-vila-mobile-v3',$('day').value,$('unit').value,$('shift').value].join(':');
function load(){try{return JSON.parse(localStorage.getItem(key())||'{}')}catch(e){return {}}}
function save(){localStorage.setItem(key(),JSON.stringify(data));progress()}
let data=load();
function render(){
$('owner').value=data.owner||'';
$('sections').innerHTML=groups.map((g,gi)=>'<section class="card"><h2>'+g[0]+'</h2><p>'+g[1]+'</p>'+g[2].map((it,i)=>{const id=gi+'-'+i,x=data[id]||{};return '<div class="item" data-id="'+id+'"><strong>'+it[0]+'</strong><small>'+it[1]+'</small><div class="choices">'+[['Feito','done'],['Pendente','pending'],['Não se aplica','na']].map(([label,value])=>'<button type="button" class="'+(x.status===value?'active ':'')+(value==='pending'?'pending':value==='na'?'na':'')+'" data-status="'+value+'">'+label+'</button>').join('')+'</div><label>Observação (opcional)<textarea data-note placeholder="Registre ocorrências ou ações corretivas">'+(x.note||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea></label></div>'}).join('')+'</section>').join('');
progress()}
function progress(){let total=0,done=0;groups.forEach((g,gi)=>g[2].forEach((_,i)=>{total++;if(data[gi+'-'+i]?.status)done++}));$('progress').textContent=done+' de '+total+' itens respondidos ('+Math.round(100*done/total)+'%)';$('fill').style.width=(100*done/total)+'%'}
$('sections').addEventListener('click',e=>{const b=e.target.closest('button[data-status]');if(!b)return;const id=b.closest('[data-id]').dataset.id;data[id]=data[id]||{};data[id].status=b.dataset.status;save();render()});
$('sections').addEventListener('change',e=>{if(!e.target.matches('[data-note]'))return;const id=e.target.closest('[data-id]').dataset.id;data[id]=data[id]||{};data[id].note=e.target.value;save()});
$('owner').addEventListener('change',()=>{data.owner=$('owner').value;save()});
['day','unit','shift'].forEach(id=>$(id).addEventListener('change',()=>{data=load();render()}));
$('reset').onclick=()=>{if(confirm('Apagar as marcações desta rotina?')){localStorage.removeItem(key());data={};render()}};
$('export').onclick=()=>{const rows=[['Data','Operação','Turno','Responsável','Seção','Item','Status','Observação']];groups.forEach((g,gi)=>g[2].forEach((it,i)=>{const x=data[gi+'-'+i]||{};rows.push([$('day').value,$('unit').value,$('shift').value,$('owner').value,g[0],it[0],x.status||'',x.note||''])}));const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='checklist-vila-'+$('day').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
render();
</script></body></html>
